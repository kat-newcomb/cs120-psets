<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Uses API</title>
<style type="text/css">
    body {font-family: Arial, sans-serif; font-size: 18px; margin: 30px;}
    h2 {margin-top: 30px;}
    label {margin-right: 10px;}
    select, input {font-size: 16px; margin-right: 15px; margin-bottom: 10px;}
    #result {margin-top: 20px; max-width: 600px;}
    .card {border: 1px solid #ccc; border-radius: 8px; padding: 15px 20px; background: #f7f7f7;}
    .category {font-weight: bold; color: #555;}
    .question {font-size: 20px; margin: 10px 0;}
    .answer {color: #2a7a2a; font-weight: bold;}
    .wrong {color: #999;}
</style>
</head>
<body>
    <h1>Trivia Question Generator</h1>
    <p>Uses the <a href="https://opentdb.com/api_config.php" target="_blank">Open Trivia Database API</a> to fetch a random trivia question.</p>

    <label for="category">Category:</label>
    <select id="category">
        <option value="9">General Knowledge</option>
        <option value="11">Film</option>
        <option value="17">Science &amp; Nature</option>
        <option value="21">Sports</option>
        <option value="22">Geography</option>
        <option value="23">History</option>
    </select>

    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>

    <input type="button" value="Get Trivia Question" onclick="getTriviaQuestion()">

    <div id="result">&nbsp;</div>

<script>
    /* Create a page called uses_api.html that will send a request to the API, retrieve some data, and display the data in a user-friendly format.
       Choose one of the methods we discussed to call the API:
       - using the AJAX pattern
       - using fetch

       Method used here: fetch (api_zipcode_fetch.html for the same pattern)
    */
    function getTriviaQuestion()
    {
        var category = document.getElementById("category").value;
        var difficulty = document.getElementById("difficulty").value;
        var url = "https://opentdb.com/api.php?amount=1&category=" + category + "&difficulty=" + difficulty + "&type=multiple";

        document.getElementById("result").innerHTML = "<p>Loading...</p>";

        fetch(url)
            .then(res => res.text())
            .then(data =>
            {
                data = JSON.parse(data);

                if (data.response_code != 0 || data.results.length == 0)
                {
                    document.getElementById("result").innerHTML = "<p>No question found. Try different options.</p>";
                    return;
                }
                q = data.results[0];
                wrongAnswers = "";
                for (i=0; i<q.incorrect_answers.length; i++)
                {
                    wrongAnswers += q.incorrect_answers[i];
                    if (i < q.incorrect_answers.length - 1)
                        wrongAnswers += ", ";
                }

                html = "<div class='card'>" +
                    "<div class='category'>" + q.category + " &mdash; " + q.difficulty + "</div>" +
                    "<div class='question'>" + q.question + "</div>" +
                    "<div class='answer'>Correct Answer: " + q.correct_answer + "</div>" +
                    "<div class='wrong'>Other options: " + wrongAnswers + "</div>" +
                    "</div>";

                document.getElementById("result").innerHTML = html;
            })
            .catch(error =>
            {
                document.getElementById("result").innerHTML = "<p>Error fetching question.</p>";
                console.log(error);
            });
    }
</script>
</body>
</html>
